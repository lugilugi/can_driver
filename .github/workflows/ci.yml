name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [dbc_usage, light_board]
    container:
      image: espressif/idf:v5.5.3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-esp32c3-${{ matrix.example }}-${{ github.run_id }}
          restore-keys: |
            ccache-esp32c3-${{ matrix.example }}-${{ github.ref }}
            ccache-esp32c3-${{ matrix.example }}-

      - name: Build ${{ matrix.example }} example
        working-directory: examples/${{ matrix.example }}
        env:
          IDF_CCACHE_ENABLE: "1"
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32c3
          idf.py build
