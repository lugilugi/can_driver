name: Publish to ESP Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (semver, e.g. 4.0.8)'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [dbc_usage, light_board]
    container:
      image: espressif/idf:v5.5.3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-esp32c3-${{ matrix.example }}-${{ github.run_id }}
          restore-keys: |
            ccache-esp32c3-${{ matrix.example }}-${{ github.ref }}
            ccache-esp32c3-${{ matrix.example }}-

      - name: Build ${{ matrix.example }} example
        working-directory: examples/${{ matrix.example }}
        env:
          IDF_CCACHE_ENABLE: "1"
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32c3
          idf.py build

  upload_component:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to ESP Component Registry
        uses: espressif/upload-components-ci-action@v2
        with:
          namespace: "lugilugi"
          components: "can_driver:."
          api_token: "${{ secrets.IDF_COMPONENT_API_TOKEN }}"
          version: "${{ steps.version.outputs.version }}"
