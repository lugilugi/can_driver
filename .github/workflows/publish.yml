name: Publish to ESP Registry

on:
  workflow_dispatch: 
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Build gate — verify the component compiles for all supported targets
  # before publishing to the ESP Component Registry.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target: [esp32c3]
    container:
      image: espressif/idf:v5.5.3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.target }}-

      - name: Build dbc_usage example
        working-directory: examples/dbc_usage
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target ${{ matrix.target }}
          idf.py build

      - name: Build light_board example
        working-directory: examples/light_board
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target ${{ matrix.target }}
          idf.py build

  upload_component:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload to ESP Component Registry
        uses: espressif/upload-components-ci-action@v2
        with:
          namespace: "lugilugi"
          components: "can_driver:."
          api_token: "${{ secrets.IDF_COMPONENT_API_TOKEN }}"
          # Derives the version from the git tag (e.g. v1.0.1 -> 1.0.1)
          version: "git"